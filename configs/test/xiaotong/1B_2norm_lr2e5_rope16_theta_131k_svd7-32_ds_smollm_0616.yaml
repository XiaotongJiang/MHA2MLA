# SmolLM1 1.7B trained on 1T tokens
checkpoints:
  checkpoint_interval: 100
  checkpoints_path: ../checkpoints/1B_2norm_lr2e5_rope16_theta_131k_svd7-32_ds_smollm_0616
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: /home/jiangxiaotong728/llama_1b_nt
  save_final_state: false
  save_initial_state: false
  load_lr_scheduler: false
  load_optimizer: false

data_stages:
- data:
    dataset:
      dataset_folder: # paths to tokenized datasets
        - ~/local/SmolLM2-1.7B-stage-4-100B
      dataset_weights:
        - 1.0
    num_loading_workers: 1
    seed: 42
  name: training stage
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: mla_smollm_ft_nt
  run: 1B_2norm_lr2e5_rope16_theta_131k_svd7-32_ds_smollm_0616
  seed: 42 # 8
  step: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    std: 0.022097086912079608
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 8192
    is_llama_config: true
    max_position_embeddings: 8192
    num_attention_heads: 32
    num_hidden_layers: 16
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling: null
    rope_theta: 79760692.22
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
    RoPE:
      partial_rope_version: 1   # Top-K keep-rotated
      top_k_rope_dim: 16        # or even 1 — just > 0
      last_k_rope_dim: 0
      uniform_start_point: 0
      uniform_step: 1
      qk_tensor_path: ""        # not used by v1
      n_gqa_group: 4
      top_k_rope_head: 1
    SVD:
      method: 7
      low_rank: 32 # multiply by num kv heads (32 * 8 = 256)

optimizer:
  accumulate_grad_in_fp32: false
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.00008 #0.00002
    lr_decay_starting_step: 10000 # 400000
    lr_decay_steps: 2000 # 100000
    lr_decay_style: 1-sqrt
    lr_warmup_steps: 200 # 1000
    lr_warmup_style: linear
    min_decay_lr: 0
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 1
parallelism:
  dp: 1 # 64
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  recompute_layer: true
  tp: 1
  tp_linear_async_communication: true
  tp_mode: REDUCE_SCATTER
  tp_recompute_allgather: true
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: meta-llama/Llama-3.2-1B
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 16
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 1 # GBS = 8*4*8*sequence_length = 256*sequence_length = 0.5M tokens
  sequence_length: 8192
  train_steps: 12000 # 500000
  val_check_interval: -1
